<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Congruence Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .stroke-4 { stroke-width: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icon Components (Replaced Lucide imports with inline SVGs) ---
        const IconBase = ({ children, className, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" 
                height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path><path d="M3 5v7h7"></path></IconBase>;
        const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"></polyline></IconBase>;
        const X = (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>;
        const Settings = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></IconBase>;
        const Flame = (props) => <IconBase {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.6-3.3.7 2 1.95 2.55 2.9 2.8z"></path></IconBase>;

        // --- Confetti Component ---
        const Confetti = () => {
            const [particles, setParticles] = useState([]);

            useEffect(() => {
                const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4'];
                const newParticles = Array.from({ length: 50 }).map((_, i) => ({
                    id: i,
                    x: Math.random() * 100,
                    y: -10 - Math.random() * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 5 + Math.random() * 10,
                    speed: 2 + Math.random() * 5,
                    wobble: Math.random() * 2 * Math.PI,
                }));
                setParticles(newParticles);
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    setParticles(prev => prev.map(p => ({
                        ...p,
                        y: p.y + p.speed,
                        wobble: p.wobble + 0.1,
                        x: p.x + Math.sin(p.wobble) * 0.5
                    })).filter(p => p.y < 110));
                }, 20);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-50">
                    {particles.map(p => (
                        <div
                            key={p.id}
                            className="absolute rounded-full opacity-80"
                            style={{
                                left: `${p.x}%`,
                                top: `${p.y}%`,
                                width: `${p.size}px`,
                                height: `${p.size}px`,
                                backgroundColor: p.color,
                                transform: `rotate(${p.wobble * 50}deg)`
                            }}
                        />
                    ))}
                </div>
            );
        };

        // --- ModClock Component ---
        const ModClock = ({ m, value, label, isActive, isSuccess, isError, targetValue }) => {
            const radius = 80;
            const center = 100;
            const numbers = Array.from({ length: m }, (_, i) => i);
            
            // Calculate hand position
            // We want 0 to be at the top (-90 degrees)
            const getAngle = (val) => {
                const remainder = val % m;
                return (remainder / m) * 360; 
            };

            const currentAngle = getAngle(value);
            const currentRemainder = value % m;

            return (
                <div className="flex flex-col items-center">
                    <div className="text-xl font-bold mb-2 text-slate-700">{label}: {targetValue !== null ? targetValue : '?'}</div>
                    <div className="relative">
                        <svg width="200" height="200" className="drop-shadow-lg">
                            {/* Clock Face */}
                            <circle cx={center} cy={center} r={radius + 15} fill="white" className="stroke-slate-200" strokeWidth="4" />
                            
                            {/* Numbers */}
                            {numbers.map((num) => {
                                const angleRad = ((num / m) * 2 * Math.PI) - (Math.PI / 2);
                                const x = center + radius * Math.cos(angleRad);
                                const y = center + radius * Math.sin(angleRad);
                                const isCurrent = num === currentRemainder && isActive;
                                
                                return (
                                    <g key={num}>
                                        <text
                                            x={x}
                                            y={y}
                                            dy="5" // Center vertically
                                            textAnchor="middle"
                                            className={`text-sm font-bold transition-colors duration-200 ${
                                                isCurrent 
                                                    ? isSuccess ? 'fill-green-600' : isError ? 'fill-red-600' : 'fill-blue-600'
                                                    : 'fill-slate-400'
                                            }`}
                                            style={{ fontSize: m > 12 ? '10px' : '14px' }}
                                        >
                                            {num}
                                        </text>
                                    </g>
                                );
                            })}

                            {/* Clock Hand */}
                            {isActive && (
                                <g transform={`rotate(${currentAngle}, ${center}, ${center})`}>
                                    <line 
                                        x1={center} 
                                        y1={center} 
                                        x2={center} 
                                        y2={center - radius + 25} 
                                        className={`stroke-4 transition-all duration-75 ${
                                            isSuccess ? 'stroke-green-500' : isError ? 'stroke-red-500' : 'stroke-indigo-500'
                                        }`}
                                        strokeWidth="4" 
                                        strokeLinecap="round"
                                    />
                                    <circle cx={center} cy={center} r="6" className="fill-slate-700" />
                                </g>
                            )}
                        </svg>
                    </div>
                </div>
            );
        };

        // --- Main Game Component ---
        const CongruenceGame = () => {
            // Game State
            const [modulus, setModulus] = useState(5);
            const [phase, setPhase] = useState('setup'); // setup, playing, animating, result
            const [numbers, setNumbers] = useState({ a: 0, b: 0 });
            const [currentTicks, setCurrentTicks] = useState({ a: 0, b: 0 });
            const [userGuess, setUserGuess] = useState(null); // true = YES, false = NO
            const [resultMessage, setResultMessage] = useState('');
            const [streak, setStreak] = useState(0);

            const startGame = () => {
                // Generate random numbers. 
                // We want them to be occasionally congruent, so we bias the random generation slightly
                const isCongruent = Math.random() > 0.5;
                
                let a = Math.floor(Math.random() * (modulus * 3)); // Ensure some rotations
                let b;

                if (isCongruent) {
                    // Create a congruent number: a + k*m
                    const k = Math.floor(Math.random() * 3) + 1;
                    b = a + (Math.random() > 0.5 ? k * modulus : -k * modulus);
                    // Ensure b is positive for simplicity in this level
                    if (b < 0) b = b + modulus * 5; 
                } else {
                    // Random number, likely not congruent
                    b = Math.floor(Math.random() * (modulus * 3));
                    // Retry once if we accidentally got a congruent number
                    if (a % modulus === b % modulus) {
                        b += 1;
                    }
                }

                setNumbers({ a, b });
                setCurrentTicks({ a: 0, b: 0 });
                setPhase('playing');
                setResultMessage('');
                setUserGuess(null);
            };

            const handleGuess = (guess) => {
                setUserGuess(guess);
                setPhase('animating');
            };

            // Animation Loop
            useEffect(() => {
                if (phase !== 'animating') return;

                const interval = setInterval(() => {
                    setCurrentTicks(prev => {
                        const nextA = prev.a < numbers.a ? prev.a + 1 : prev.a;
                        const nextB = prev.b < numbers.b ? prev.b + 1 : prev.b;

                        if (nextA === numbers.a && nextB === numbers.b) {
                            // Animation done
                            clearInterval(interval);
                            finishGame();
                            return { a: nextA, b: nextB };
                        }
                        return { a: nextA, b: nextB };
                    });
                }, 50); // Speed of ticking

                return () => clearInterval(interval);
            }, [phase, numbers]);

            const finishGame = () => {
                const remA = numbers.a % modulus;
                const remB = numbers.b % modulus;
                const areCongruent = remA === remB;
                const isCorrect = userGuess === areCongruent;

                if (isCorrect) {
                    setStreak(s => s + 1);
                    setResultMessage(areCongruent 
                        ? "Correct! They land on the same spot!" 
                        : "Correct! They are different!");
                } else {
                    setStreak(0);
                    setResultMessage("Not this time! Check where the clocks stopped.");
                }
                setPhase('result');
            };

            const resetGame = () => {
                setPhase('setup');
            };

            const isSuccess = phase === 'result' && 
                ((userGuess === true && numbers.a % modulus === numbers.b % modulus) || 
                 (userGuess === false && numbers.a % modulus !== numbers.b % modulus));

            const isError = phase === 'result' && !isSuccess;

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-indigo-100 p-4 flex flex-col items-center">
                    {isSuccess && <Confetti />}

                    <header className="w-full max-w-3xl mb-8 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-2">
                            <div className="bg-indigo-600 text-white p-2 rounded-lg">
                                <Settings size={20} />
                            </div>
                            <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 hidden sm:block">
                                Modular Clocks
                            </h1>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className={`flex items-center gap-2 px-3 py-1 rounded-full font-bold transition-all ${
                                streak > 0 ? 'bg-orange-100 text-orange-600' : 'bg-slate-100 text-slate-400'
                            }`}>
                                <Flame size={18} className={streak > 0 ? "fill-orange-500 animate-pulse" : ""} />
                                <span>Streak: {streak}</span>
                            </div>
                            
                            {phase === 'setup' && (
                                <div className="flex items-center gap-4 border-l pl-4 border-slate-200">
                                    <label className="text-sm font-semibold text-slate-500 hidden sm:block">Modulus (m):</label>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => setModulus(Math.max(2, modulus - 1))}
                                            className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-600"
                                        >-</button>
                                        <span className="text-2xl font-bold w-8 text-center">{modulus}</span>
                                        <button 
                                            onClick={() => setModulus(Math.min(16, modulus + 1))}
                                            className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-600"
                                        >+</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden relative">
                        
                        {/* Game Area */}
                        <div className="p-8">
                            
                            {/* Clocks Container */}
                            <div className="flex flex-col md:flex-row justify-around items-center gap-8 mb-12">
                                <ModClock 
                                    m={modulus} 
                                    value={phase === 'setup' ? 0 : currentTicks.a} 
                                    targetValue={phase === 'setup' ? null : numbers.a}
                                    label="Number A"
                                    isActive={phase !== 'setup'}
                                    isSuccess={isSuccess}
                                    isError={isError}
                                />
                                
                                <div className="hidden md:block h-32 w-px bg-slate-200"></div>
                                
                                <ModClock 
                                    m={modulus} 
                                    value={phase === 'setup' ? 0 : currentTicks.b}
                                    targetValue={phase === 'setup' ? null : numbers.b}
                                    label="Number B"
                                    isActive={phase !== 'setup'}
                                    isSuccess={isSuccess}
                                    isError={isError}
                                />
                            </div>

                            {/* Controls */}
                            <div className="flex flex-col items-center justify-center min-h-[120px]">
                                
                                {phase === 'setup' && (
                                    <div className="text-center animate-fade-in">
                                        <p className="text-slate-500 mb-6 max-w-md mx-auto">
                                            I will show you two numbers. Guess if they end up at the same spot on a clock with <strong>{modulus}</strong> hours.
                                        </p>
                                        <button 
                                            onClick={startGame}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-full font-bold text-lg shadow-lg shadow-indigo-200 transition-all transform hover:scale-105 flex items-center gap-2"
                                        >
                                            <Play size={20} fill="currentColor" /> Start Game
                                        </button>
                                    </div>
                                )}

                                {phase === 'playing' && (
                                    <div className="text-center animate-fade-in">
                                        <h3 className="text-2xl font-bold mb-6 text-slate-800">
                                            Are {numbers.a} and {numbers.b} congruent (mod {modulus})?
                                        </h3>
                                        <div className="flex gap-4">
                                            <button 
                                                onClick={() => handleGuess(true)}
                                                className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-xl font-bold text-lg shadow-lg shadow-emerald-100 transition-transform hover:-translate-y-1 flex items-center gap-2 min-w-[140px] justify-center"
                                            >
                                                <Check strokeWidth={3} /> YES
                                            </button>
                                            <button 
                                                onClick={() => handleGuess(false)}
                                                className="flex-1 bg-rose-500 hover:bg-rose-600 text-white px-8 py-4 rounded-xl font-bold text-lg shadow-lg shadow-rose-100 transition-transform hover:-translate-y-1 flex items-center gap-2 min-w-[140px] justify-center"
                                            >
                                                <X strokeWidth={3} /> NO
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {phase === 'animating' && (
                                    <div className="text-center animate-pulse text-indigo-600 font-semibold">
                                        Calculating remainders...
                                    </div>
                                )}

                                {phase === 'result' && (
                                    <div className="text-center animate-fade-in">
                                        <h3 className={`text-2xl font-bold mb-2 ${isSuccess ? 'text-green-600' : 'text-slate-700'}`}>
                                            {resultMessage}
                                        </h3>
                                        <p className="text-slate-500 mb-6 font-mono">
                                            {numbers.a} ≡ {numbers.a % modulus} (mod {modulus}) <br/>
                                            {numbers.b} ≡ {numbers.b % modulus} (mod {modulus})
                                        </p>
                                        <div className="flex gap-4 justify-center">
                                            <button 
                                                onClick={startGame}
                                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2"
                                            >
                                                Next Question
                                            </button>
                                            <button 
                                                onClick={resetGame}
                                                className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-6 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2"
                                            >
                                                <RotateCcw size={18} /> Change Modulus
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        {/* Footer info */}
                        <div className="bg-slate-50 border-t border-slate-100 p-4 text-center text-xs text-slate-400">
                            Modular Arithmetic Visualisation
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CongruenceGame />);
    </script>
</body>
</html>
