<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Encryption</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap');

        body {
            font-family: 'Roboto Slab', serif; /* Academic feel */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .math-font {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom scrollbar for math overflow */
        .math-container::-webkit-scrollbar {
            height: 6px;
        }
        .math-container::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <canvas id="confetti-canvas"></canvas>

    <div class="max-w-2xl w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-2">RSA Encryption</h1>
            <p class="text-slate-400 text-sm mono-font">Task 5: Compute the ciphertext</p>
        </div>

        <!-- Progress Bar -->
        <div class="mb-6 bg-slate-700 h-2 rounded-full overflow-hidden shadow-inner">
            <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-500 ease-out w-0"></div>
        </div>

        <!-- Game Card -->
        <div id="game-card" class="card rounded-2xl p-8 shadow-2xl relative overflow-hidden slide-in">
            
            <!-- Level Indicator -->
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <span class="text-slate-400 text-sm uppercase tracking-wider font-bold">Problem <span id="current-level">1</span> of <span id="total-levels">6</span></span>
                <div class="flex gap-1 text-xs font-mono bg-slate-800 px-3 py-1 rounded text-blue-300">
                    <span>c &equiv; m<sup>e</sup> (mod n)</span>
                </div>
            </div>

            <!-- Problem Area -->
            <div class="mb-8">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-lg">
                    <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-center">
                        <span class="math-font text-slate-400">p = </span>
                        <span id="val-p" class="font-bold text-white"></span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-center">
                        <span class="math-font text-slate-400">q = </span>
                        <span id="val-q" class="font-bold text-white"></span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-center">
                        <span class="math-font text-slate-400">n = </span>
                        <span id="val-n" class="font-bold text-blue-400"></span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-center">
                        <span class="math-font text-slate-400">&phi;(n) = </span>
                        <span id="val-phi" class="font-bold text-slate-300"></span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-center ring-1 ring-purple-500/30">
                        <span class="math-font text-slate-400">e = </span>
                        <span id="val-e" class="font-bold text-purple-400"></span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded border border-slate-700/50 text-center ring-1 ring-purple-500/30">
                        <span class="math-font text-slate-400">m = </span>
                        <span id="val-m" class="font-bold text-purple-400"></span>
                    </div>
                </div>
            </div>

            <!-- Interaction Area -->
            <div class="flex flex-col items-center gap-6" id="input-section">
                <div class="w-full max-w-sm">
                    <label class="block text-slate-400 text-sm mb-2 text-center">Enter Ciphertext (c)</label>
                    <input type="number" id="user-input" 
                        class="w-full bg-slate-900 border border-slate-600 rounded-xl p-4 text-center text-3xl font-bold text-white focus:outline-none input-glow transition-all"
                        placeholder="?" autocomplete="off">
                </div>

                <button onclick="checkAnswer()" id="verify-btn"
                    class="group relative inline-flex items-center justify-center px-8 py-3 text-lg font-bold text-white transition-all duration-200 bg-blue-600 font-pj rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 hover:bg-blue-500 hover:scale-105 active:scale-95 w-full max-w-xs cursor-pointer">
                    Verify Answer
                </button>

                <div id="feedback-msg" class="h-6 text-center font-bold text-lg transition-opacity duration-300 opacity-0"></div>
            </div>

            <!-- Next Button (Hidden initially) -->
            <div id="next-section" class="hidden flex-col items-center gap-4 animate-fade-in">
                <div class="text-green-400 text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-check-circle"></i> Correct!
                </div>
                <div class="text-slate-400 text-sm mono-font mb-2">
                    Calculation: <span id="calc-display"></span>
                </div>
                <button onclick="nextLevel()" id="next-btn"
                    class="px-8 py-3 bg-green-600 hover:bg-green-500 text-white rounded-xl font-bold transition-all hover:scale-105 shadow-lg shadow-green-900/50 w-full max-w-xs">
                    Next Problem <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>

        </div>

        <!-- Success Screen (Hidden) -->
        <div id="success-screen" class="hidden card rounded-2xl p-12 text-center slide-in">
            <div class="text-6xl mb-6 text-yellow-400">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-4">Encryption Complete!</h2>
            <p class="text-slate-400 mb-8">You have successfully encrypted all messages.</p>
            <button onclick="location.reload()" 
                class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition-all">
                Restart
            </button>
        </div>

    </div>

    <script>
        // --- Game Data ---
        const levels = [
            { p: 3, q: 11, n: 33, phi: 20, e: 3, m: 2 },
            { p: 5, q: 13, n: 65, phi: 48, e: 5, m: 3 },
            { p: 7, q: 17, n: 119, phi: 96, e: 5, m: 4 },
            { p: 11, q: 19, n: 209, phi: 180, e: 7, m: 5 },
            { p: 13, q: 23, n: 299, phi: 264, e: 5, m: 6 },
            { p: 17, q: 29, n: 493, phi: 448, e: 3, m: 7 }
        ];

        let currentLevelIndex = 0;
        let isAnimating = false;

        // --- Core Logic: Modular Exponentiation ---
        // Calculates (base^exp) % mod safely for integers
        function modularExponentiation(base, exp, mod) {
            let result = 1;
            base = base % mod;
            while (exp > 0) {
                if (exp % 2 === 1) { // If exp is odd
                    result = (result * base) % mod;
                }
                exp = Math.floor(exp / 2);
                base = (base * base) % mod;
            }
            return result;
        }

        // --- UI Functions ---

        function initGame() {
            document.getElementById('total-levels').innerText = levels.length;
            loadLevel(currentLevelIndex);
            
            // Add enter key support
            document.getElementById('user-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });
        }

        function loadLevel(index) {
            const level = levels[index];
            
            // Update Text
            document.getElementById('current-level').innerText = index + 1;
            document.getElementById('val-p').innerText = level.p;
            document.getElementById('val-q').innerText = level.q;
            document.getElementById('val-n').innerText = level.n;
            document.getElementById('val-phi').innerText = level.phi;
            document.getElementById('val-e').innerText = level.e;
            document.getElementById('val-m').innerText = level.m;

            // Reset UI States
            document.getElementById('user-input').value = '';
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('next-section').classList.add('hidden');
            document.getElementById('feedback-msg').style.opacity = '0';
            
            // Update Progress Bar
            const progress = (index / levels.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function checkAnswer() {
            if (isAnimating) return;

            const input = document.getElementById('user-input');
            const feedback = document.getElementById('feedback-msg');
            const userVal = parseInt(input.value);
            const currentData = levels[currentLevelIndex];

            if (isNaN(userVal)) {
                shakeCard();
                return;
            }

            // Calculate correct answer
            const correctAnswer = modularExponentiation(currentData.m, currentData.e, currentData.n);

            if (userVal === correctAnswer) {
                // Success
                handleSuccess(currentData, correctAnswer);
            } else {
                // Failure
                handleFailure(feedback);
            }
        }

        function handleSuccess(data, answer) {
            const inputSection = document.getElementById('input-section');
            const nextSection = document.getElementById('next-section');
            const calcDisplay = document.getElementById('calc-display');

            // Fire confetti
            fireConfetti();

            // Hide input, show next button
            inputSection.classList.add('hidden');
            nextSection.classList.remove('hidden');
            nextSection.classList.add('flex'); // Ensure flex display

            // Show calculation string
            calcDisplay.innerHTML = `${data.m}<sup>${data.e}</sup> (mod ${data.n}) = ${answer}`;
        }

        function handleFailure(feedbackEl) {
            feedbackEl.innerText = "Incorrect. Try again.";
            feedbackEl.className = "h-6 text-center font-bold text-lg text-red-400";
            feedbackEl.style.opacity = '1';
            shakeCard();
        }

        function nextLevel() {
            currentLevelIndex++;
            if (currentLevelIndex < levels.length) {
                loadLevel(currentLevelIndex);
                // Focus only here, never on first load: this page is embedded in the RSA notes,
                // and focusing on load scrolls the notes down to it and takes the keyboard.
                document.getElementById('user-input').focus();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            document.getElementById('game-card').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            fireConfetti();
            setTimeout(fireConfetti, 500);
            setTimeout(fireConfetti, 1000);
        }

        function shakeCard() {
            const card = document.getElementById('game-card');
            card.classList.remove('shake');
            void card.offsetWidth; // trigger reflow
            card.classList.add('shake');
        }

        // --- Confetti Engine (Lightweight) ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 150;
            const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20 - 5,
                    life: 100 + Math.random() * 50,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 5 + 2
                });
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        active = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.5; // Gravity
                        p.life--;
                        
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (active) {
                    requestAnimationFrame(update);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            update();
        }

        // Handle resize for confetti
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start
        initGame();

    </script>
</body>
</html>
