<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eigenvalues of Projection — Interactive Linear Algebra Visualisation</title>
    <meta name="description" content="Drag a vector to explore how projection matrices work. Discover eigenvectors and eigenvalues (0 and 1) of orthogonal projections interactively.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <style>
        /* Force minimum height to prevent LMS squashing */
        html, body { 
            height: 100%; 
            min-height: 600px; /* Critical for Blackboard */
        }
        body { font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; }
        canvas { touch-action: none; }
        .math-text { font-family: 'Times New Roman', serif; font-style: italic; }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col min-h-[600px]">

    <!-- Header / Controls -->
    <div class="p-4 bg-slate-800 border-b border-slate-700 shadow-md flex flex-col md:flex-row justify-between items-center z-10 gap-4 flex-shrink-0">
        <div>
            <h1 class="text-xl font-bold text-blue-400">Eigenvalues of Projection</h1>
        </div>
        
        <div class="flex items-center gap-4 bg-slate-900 p-3 rounded-lg border border-slate-700">
            <label class="text-sm text-slate-300 font-semibold">Projection Line Angle:</label>
            <input type="range" id="angleSlider" min="0" max="180" value="45" class="w-32 md:w-48 accent-blue-500 cursor-pointer">
            <span id="angleDisplay" class="text-sm font-mono w-12 text-right text-blue-300">45°</span>
        </div>
    </div>

    <!-- Main Canvas Area -->
    <div class="flex-grow relative flex justify-center items-center bg-slate-950 overflow-hidden w-full" id="canvasContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Mobile Status Toggle -->
        <button id="toggleStatusBtn" class="sm:hidden absolute top-4 right-4 bg-slate-900/80 text-white text-xs px-3 py-1.5 rounded-full border border-slate-600 shadow-lg z-20">
            Show status
        </button>
        
        <!-- Floating Status HUD -->
        <div id="statusHUD" class="absolute top-4 right-4 bg-slate-900/90 backdrop-blur p-4 rounded-xl border border-slate-700 shadow-2xl w-64 pointer-events-none select-none">
            <div class="flex justify-between items-center mb-2">
                <span class="text-slate-400 text-xs uppercase tracking-wider">Status</span>
                <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>
            </div>
            
            <h2 id="statusText" class="text-2xl font-bold text-red-400 mb-1">Not Eigenvector</h2>
            
            <div class="space-y-2 mt-3 border-t border-slate-700 pt-2">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Input <span class="math-text">v</span>:</span>
                    <span id="inputVecVal" class="font-mono text-white">0, 0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">Output <span class="math-text">Pv</span>:</span>
                    <span id="outputVecVal" class="font-mono text-white">0, 0</span>
                </div>
                <div class="mt-2 p-2 bg-slate-800 rounded text-center font-bold" id="lambdaBox">
                    λ = ?
                </div>
            </div>
        </div>
        
        <!-- Tutorial / Hint Overlay (fades out) -->
        <div id="tutorial" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-blue-600/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-semibold animate-pulse pointer-events-none transition-opacity duration-500 hidden"></div>

        <!-- Delayed Question Overlay -->
        <div id="projectionQuestion" class="absolute bottom-24 left-1/2 transform -translate-x-1/2 bg-purple-600/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-semibold pointer-events-none transition-opacity duration-700 opacity-0">
            <span class="math-text">Can you visualise why P² = P?</span>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvasContainer');
const angleSlider = document.getElementById('angleSlider');
const angleDisplay = document.getElementById('angleDisplay');
const statusIndicator = document.getElementById('statusIndicator');
const statusText = document.getElementById('statusText');
const inputVecVal = document.getElementById('inputVecVal');
const outputVecVal = document.getElementById('outputVecVal');
const lambdaBox = document.getElementById('lambdaBox');
const tutorial = document.getElementById('tutorial');
const projectionQuestion = document.getElementById('projectionQuestion');
const statusHUD = document.getElementById('statusHUD');
const toggleStatusBtn = document.getElementById('toggleStatusBtn');

// Game State
let width, height, centerX, centerY;
let scale = 40; // pixels per unit
let lineAngle = 45 * (Math.PI / 180); // radians
let vector = { x: 3, y: 2 }; // logic coordinates
let isDragging = false;
let mousePos = { x: 0, y: 0 };
let isEigenvector = false;
let eigenvalue = null;

// Initial Resize
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width;
    canvas.height = height;
    centerX = width / 2;
    centerY = height / 2;
    scale = Math.min(width, height) / 20; // Dynamic scale
    draw();
}

window.addEventListener('resize', resize);

// Mobile: toggle status HUD visibility
if (statusHUD && toggleStatusBtn) {
    let statusVisible = window.innerWidth > 640;

    if (window.innerWidth <= 640) {
        statusHUD.style.display = 'none';
        statusVisible = false;
        toggleStatusBtn.style.display = 'inline-flex';
        toggleStatusBtn.textContent = 'Show status';
    } else {
        toggleStatusBtn.style.display = 'none';
    }

    toggleStatusBtn.addEventListener('click', () => {
        statusVisible = !statusVisible;
        statusHUD.style.display = statusVisible ? 'block' : 'none';
        toggleStatusBtn.textContent = statusVisible ? 'Hide status' : 'Show status';
    });

    window.addEventListener('resize', () => {
        if (window.innerWidth <= 640) {
            toggleStatusBtn.style.display = 'inline-flex';
            if (!statusVisible) {
                statusHUD.style.display = 'none';
                toggleStatusBtn.textContent = 'Show status';
            }
        } else {
            statusHUD.style.display = 'block';
            toggleStatusBtn.style.display = 'none';
            statusVisible = true;
        }
    });
}

// Reveal the key question after 15 seconds
setTimeout(() => {
    if (projectionQuestion) {
        projectionQuestion.classList.remove('opacity-0');
        projectionQuestion.classList.add('opacity-100');
    }
}, 15000);

// Interaction Logic
function getMousePos(evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.clientX || evt.touches[0].clientX;
    const clientY = evt.clientY || evt.touches[0].clientY;
    return {
        x: (clientX - rect.left - centerX) / scale,
        y: -(clientY - rect.top - centerY) / scale // Flip Y for math coords
    };
}

function handleStart(evt) {
    const pos = getMousePos(evt);
    // Check if clicking near vector tip (radius 0.5 units)
    const dx = pos.x - vector.x;
    const dy = pos.y - vector.y;
    if (dx*dx + dy*dy < 1) {
        isDragging = true;
        tutorial.style.opacity = '0'; // Hide tutorial on first interaction
    }
}

function handleMove(evt) {
    if (isDragging) {
        evt.preventDefault();
        const pos = getMousePos(evt);
        // Clamp to screen edges roughly
        vector.x = pos.x;
        vector.y = pos.y;
        draw();
    }
}

function handleEnd() {
    isDragging = false;
}

// Event Listeners
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);
canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('touchmove', handleMove, {passive: false});
window.addEventListener('touchend', handleEnd);

angleSlider.addEventListener('input', (e) => {
    const deg = e.target.value;
    angleDisplay.textContent = `${deg}°`;
    lineAngle = deg * (Math.PI / 180);
    draw();
});

// Math Logic: Projection
function project(v, angle) {
    // Direction vector of the line
    const u = { x: Math.cos(angle), y: Math.sin(angle) };
    
    // Dot product v . u
    const dot = v.x * u.x + v.y * u.y;
    
    // Projection p = (v.u) * u
    return { x: dot * u.x, y: dot * u.y };
}

function toScreen(x, y) {
    return {
        x: centerX + x * scale,
        y: centerY - y * scale
    };
}

function drawArrow(from, to, color, width = 2, dash = []) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash);
    const start = toScreen(from.x, from.y);
    const end = toScreen(to.x, to.y);
    
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrow head
    const angle = Math.atan2(end.y - start.y, end.x - start.x);
    const headLen = 10 + width;
    
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(end.x, end.y);
    ctx.lineTo(end.x - headLen * Math.cos(angle - Math.PI / 6), end.y - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(end.x - headLen * Math.cos(angle + Math.PI / 6), end.y - headLen * Math.sin(angle + Math.PI / 6));
    ctx.fill();
}

function drawGrid() {
    ctx.strokeStyle = '#1e293b'; // slate-800
    ctx.lineWidth = 1;
    
    // Vertical lines
    for (let x = 0; x < width/2; x += scale) {
        ctx.beginPath(); ctx.moveTo(centerX + x, 0); ctx.lineTo(centerX + x, height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX - x, 0); ctx.lineTo(centerX - x, height); ctx.stroke();
    }
    // Horizontal lines
    for (let y = 0; y < height/2; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, centerY + y); ctx.lineTo(width, centerY + y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, centerY - y); ctx.lineTo(width, centerY - y); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#475569'; // slate-600
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(width, centerY); ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    drawGrid();

    // 1. Draw Projection Line (The Subspace)
    // Extend line far off screen
    const lineLen = 100; 
    const lineX = Math.cos(lineAngle) * lineLen;
    const lineY = Math.sin(lineAngle) * lineLen;
    
    ctx.beginPath();
    ctx.strokeStyle = '#94a3b8'; // slate-400
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    const p1 = toScreen(-lineX, -lineY);
    const p2 = toScreen(lineX, lineY);
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // 2. Calculate Projection
    const projVec = project(vector, lineAngle);

    // 3. Determine Eigen Status
    // Tolerance for float comparison
    const tolerance = 0.15; 
    
    // Distance from tip of vector to projection line (perpendicular distance)
    // If dist is approx 0, Lambda = 1
    // If projection length is approx 0, Lambda = 0
    
    // Logic for Lambda = 1: Vector is parallel to line. Proj == Vector.
    const distSq = (vector.x - projVec.x)**2 + (vector.y - projVec.y)**2;
    const isLambda1 = distSq < tolerance;

    // Logic for Lambda = 0: Vector is perpendicular. Proj == 0.
    const projMagSq = projVec.x**2 + projVec.y**2;
    const isLambda0 = projMagSq < tolerance && (vector.x**2 + vector.y**2) > tolerance;

    isEigenvector = isLambda1 || isLambda0;
    
    // 4. Update UI Text
    inputVecVal.textContent = `${vector.x.toFixed(1)}, ${vector.y.toFixed(1)}`;
    outputVecVal.textContent = `${projVec.x.toFixed(1)}, ${projVec.y.toFixed(1)}`;
    
    let mainColor = '#ef4444'; // Red
    if (isEigenvector) {
        mainColor = '#22c55e'; // Green
        statusIndicator.className = `w-3 h-3 rounded-full bg-green-500 shadow-[0_0_15px_rgba(34,197,94,1)]`;
        statusText.textContent = "Eigenvector!";
        statusText.className = "text-2xl font-bold text-green-400 mb-1";
        
        if (isLambda1) {
            lambdaBox.innerHTML = `λ = 1 <br><span class="text-xs font-normal opacity-75">(On the line)</span>`;
            lambdaBox.className = "mt-2 p-2 bg-green-900/50 border border-green-500/30 text-green-200 rounded text-center font-bold";
        } else {
            lambdaBox.innerHTML = `λ = 0 <br><span class="text-xs font-normal opacity-75">(Orthogonal)</span>`;
            lambdaBox.className = "mt-2 p-2 bg-green-900/50 border border-green-500/30 text-green-200 rounded text-center font-bold";
        }
    } else {
        statusIndicator.className = `w-3 h-3 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]`;
        statusText.textContent = "Not Eigenvector";
        statusText.className = "text-2xl font-bold text-red-400 mb-1";
        lambdaBox.innerHTML = `No scalar λ <br><span class="text-xs font-normal opacity-75">(Input rotates)</span>`;
        lambdaBox.className = "mt-2 p-2 bg-red-900/50 border border-red-500/30 text-red-200 rounded text-center font-bold";
    }

    // 5. Draw Vectors
    
    // Draw Projection Shadow (Ghost)
    if (!isLambda1 && !isLambda0) {
        // Draw the projection vector first (behind)
        drawArrow({x:0, y:0}, projVec, '#fde047', 3, [5, 5]); // Yellow dashed
        
        // Draw connecting line (projection orthogonal line)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.setLineDash([2, 2]);
        const vPos = toScreen(vector.x, vector.y);
        const pPos = toScreen(projVec.x, projVec.y);
        ctx.moveTo(vPos.x, vPos.y);
        ctx.lineTo(pPos.x, pPos.y);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Draw Input Vector (The Main Actor)
    drawArrow({x:0, y:0}, vector, mainColor, 5);

    // Draw Draggable Handle
    const tip = toScreen(vector.x, vector.y);
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = isDragging ? '#ffffff' : '#3b82f6'; // White if dragging, Blue otherwise
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Add glow to handle if hovering logic or just generally
    if (isDragging) {
         ctx.shadowColor = 'white';
         ctx.shadowBlur = 10;
         ctx.stroke();
         ctx.shadowBlur = 0;
    }

    // Origin dot
    const origin = toScreen(0, 0);
    ctx.beginPath();
    ctx.arc(origin.x, origin.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
}

// Initialize
resize();

</script>
</body>
</html>
