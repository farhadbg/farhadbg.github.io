<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permutation Groups</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom scrollbar for the notation area */
        .scrollbar-thin::-webkit-scrollbar {
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 20px;
        }
        
        /* Matrix Grid Animation */
        .matrix-cell {
            transition: all 0.2s ease-in-out;
        }

        /* Resizer Handle Hover Effect */
        .resizer-handle:hover > div {
            background-color: #6366f1; /* Indigo-500 */
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- ICONS ---
        const Icon = ({ children, className = "", size = 24, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Play = (props) => <Icon {...props}><polygon points="5 3 19 12 5 21 5 3"/></Icon>;
        const RotateCcw = (props) => <Icon {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></Icon>;
        const Check = (props) => <Icon {...props}><polyline points="20 6 9 17 4 12"/></Icon>;
        const X = (props) => <Icon {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
        const Calculator = (props) => <Icon {...props}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="14"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></Icon>;
        const Trophy = (props) => <Icon {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"/></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"/></Icon>;
        const Zap = (props) => <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;
        const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
        const Grid3x3 = (props) => <Icon {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></Icon>;
        const GripVertical = (props) => <Icon {...props}><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></Icon>;

        // --- MATH UTILITIES ---

        const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

        const lcm = (a, b) => {
            if (a === 0 || b === 0) return 0;
            return Math.abs((a * b) / gcd(a, b));
        };

        const calculateArrayLCM = (arr) => {
            if (arr.length === 0) return 0;
            let result = arr[0];
            for (let i = 1; i < arr.length; i++) {
                result = lcm(result, arr[i]);
            }
            return result;
        };

        // Generate permutation by composing random STRICTLY INCREASING cycles.
        const generatePermutation = (n) => {
            let perm = Array.from({ length: n }, (_, i) => i);
            const numCycles = Math.max(2, Math.floor(n / 1.5)); 
            
            for (let k = 0; k < numCycles; k++) {
                const kSize = Math.floor(Math.random() * (n - 1)) + 2;
                const subset = [];
                const pool = Array.from({ length: n }, (_, i) => i);
                
                for (let j = 0; j < kSize; j++) {
                    const idx = Math.floor(Math.random() * pool.length);
                    subset.push(pool[idx]);
                    pool.splice(idx, 1);
                }
                
                // Sort to ensure cycle elements are increasing
                subset.sort((a, b) => a - b);
                
                const nextPerm = [...perm];
                const cycleMap = {};
                for (let j = 0; j < subset.length; j++) {
                    cycleMap[subset[j]] = subset[(j + 1) % subset.length];
                }
                
                for (let i = 0; i < n; i++) {
                    const valAfterOld = perm[i];
                    if (cycleMap[valAfterOld] !== undefined) {
                        nextPerm[i] = cycleMap[valAfterOld];
                    }
                }
                perm = nextPerm;
            }
            return perm;
        };

        const getPermutationPower = (perm, exp) => {
            const n = perm.length;
            if (exp === 0) return Array.from({ length: n }, (_, i) => i);

            let p = [...perm];
            let e = exp;

            if (e < 0) {
                const inverse = new Array(n);
                for (let i = 0; i < n; i++) inverse[perm[i]] = i;
                p = inverse;
                e = -e;
            }

            let result = Array.from({ length: n }, (_, i) => i);
            for (let k = 0; k < e; k++) {
                const next = new Array(n);
                for (let i = 0; i < n; i++) {
                    next[i] = p[result[i]];
                }
                result = next;
            }
            return result;
        };

        const getCycles = (perm) => {
            const n = perm.length;
            const visited = new Array(n).fill(false);
            const cycles = [];

            for (let i = 0; i < n; i++) {
                if (!visited[i]) {
                    const cycle = [];
                    let curr = i;
                    while (!visited[curr]) {
                        visited[curr] = true;
                        cycle.push(curr);
                        curr = perm[curr];
                    }
                    cycles.push(cycle);
                }
            }
            return cycles;
        };

        const isIdentity = (perm) => {
            return perm.every((val, idx) => val === idx);
        };

        const formatCycleNotation = (cycles) => {
            const normalizedCycles = cycles.map(cycle => {
                const minVal = Math.min(...cycle);
                const minIdx = cycle.indexOf(minVal);
                if (minIdx === 0) return cycle;
                return [...cycle.slice(minIdx), ...cycle.slice(0, minIdx)];
            });

            normalizedCycles.sort((a, b) => a[0] - b[0]);
            
            const nonFixed = normalizedCycles.filter(c => c.length > 1);
            if (nonFixed.length === 0) return 'e'; 

            return nonFixed
                .map(cycle => `(${cycle.map(x => x + 1).join(' ')})`)
                .join('');
        };

        // --- MAIN COMPONENT ---

        function CycleScout() {
            const [mode, setMode] = useState('matrix'); 
            
            const [n, setN] = useState(6); 
            const [basePerm, setBasePerm] = useState([]); 
            const [currentPerm, setCurrentPerm] = useState([]); 
            const [cycles, setCycles] = useState([]); 
            const [baseCycles, setBaseCycles] = useState([]); 
            
            // Resizing State
            const [sidebarWidth, setSidebarWidth] = useState(380);
            const [isResizing, setIsResizing] = useState(false);

            // Game State
            const [foundCycles, setFoundCycles] = useState(new Set());
            const [userAnswer, setUserAnswer] = useState('');
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [gameStatus, setGameStatus] = useState('idle');
            
            // Explorer/Matrix State
            const [exponent, setExponent] = useState(1);
            const [highlightedCycleIndex, setHighlightedCycleIndex] = useState(null);

            const svgRef = useRef(null);

            // --- RESIZING LOGIC ---
            const startResizing = useCallback((e) => {
                e.preventDefault(); // Prevent text selection
                setIsResizing(true);
            }, []);

            const stopResizing = useCallback(() => {
                setIsResizing(false);
            }, []);

            const resize = useCallback((e) => {
                if (isResizing) {
                    const newWidth = document.body.clientWidth - e.clientX;
                    // Limit width to keep UI usable
                    if (newWidth > 300 && newWidth < 800) {
                        setSidebarWidth(newWidth);
                    }
                }
            }, [isResizing]);

            useEffect(() => {
                window.addEventListener("mousemove", resize);
                window.addEventListener("mouseup", stopResizing);
                return () => {
                    window.removeEventListener("mousemove", resize);
                    window.removeEventListener("mouseup", stopResizing);
                };
            }, [resize, stopResizing]);

            // Init
            useEffect(() => {
                generateNewBase();
            }, [n]); 

            // Update Loop
            useEffect(() => {
                if (basePerm.length === 0) return;

                setBaseCycles(getCycles(basePerm));

                if (mode === 'explorer' || mode === 'matrix') {
                    const powered = getPermutationPower(basePerm, exponent);
                    setCurrentPerm(powered);
                    setCycles(getCycles(powered));
                    setHighlightedCycleIndex(null); 
                } else {
                    setCurrentPerm(basePerm);
                    setCycles(getCycles(basePerm));
                }
            }, [basePerm, exponent, mode]);

            const generateNewBase = () => {
                const newPerm = generatePermutation(n);
                setBasePerm(newPerm);
                setFoundCycles(new Set());
                setFeedback(null);
                setGameStatus('playing');
                setUserAnswer('');
                setExponent(1);
            };

            const handleDifficulty = (difficulty) => {
                let size = 5;
                if (difficulty === 'easy') size = 5;
                if (difficulty === 'medium') size = 6;
                if (difficulty === 'hard') size = 7;
                if (difficulty === 'expert') size = 12;
                setN(size);
            };

            const handleNodeClick = (nodeIndex) => {
                if (mode === 'game' && gameStatus === 'playing') {
                    const cycleIndex = cycles.findIndex(cycle => cycle.includes(nodeIndex));
                    if (cycleIndex !== -1) {
                        setHighlightedCycleIndex(cycleIndex);
                        const newFound = new Set(foundCycles);
                        newFound.add(cycleIndex);
                        setFoundCycles(newFound);
                    }
                }
                
                if (mode === 'explorer' || mode === 'matrix') {
                    const cycleIndex = cycles.findIndex(cycle => cycle.includes(nodeIndex));
                    if (highlightedCycleIndex === cycleIndex) {
                        setHighlightedCycleIndex(null);
                    } else {
                        setHighlightedCycleIndex(cycleIndex);
                    }
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const val = parseInt(userAnswer);
                if (isNaN(val)) return;

                const lengths = cycles.map(c => c.length);
                const correctLCM = calculateArrayLCM(lengths);

                if (val === correctLCM) {
                    setFeedback('correct');
                    setScore(s => s + (n * 10) + (cycles.length * 5));
                    setGameStatus('won');
                } else {
                    setFeedback('incorrect');
                    setScore(s => Math.max(0, s - 10));
                }
            };

            // Visual Helpers
            const radius = 170; 
            const center = 200; 

            const getNodePos = (index, total) => {
                const angle = (index / total) * 2 * Math.PI - (Math.PI / 2);
                return {
                    x: center + radius * Math.cos(angle),
                    y: center + radius * Math.sin(angle),
                };
            };

            const getArrowPath = (i, j, total) => {
                const start = getNodePos(i, total);
                const end = getNodePos(j, total);
                
                if (i === j) {
                    const loopRadius = 35;
                    const dx = start.x - center;
                    const dy = start.y - center;
                    const len = Math.sqrt(dx*dx + dy*dy);
                    const nx = dx/len;
                    const ny = dy/len;
                    return `M ${start.x} ${start.y} C ${start.x + nx*60 + ny*40} ${start.y + ny*60 - nx*40}, ${start.x + nx*60 - ny*40} ${start.y + ny*60 + nx*40}, ${start.x} ${start.y}`;
                }

                const mx = (start.x + end.x) / 2;
                const my = (start.y + end.y) / 2;
                const curvature = 0.25; 
                const cx = mx * (1 - curvature) + center * curvature;
                const cy = my * (1 - curvature) + center * curvature;

                return `M ${start.x} ${start.y} Q ${cx} ${cy} ${end.x} ${end.y}`;
            };

            const cycleColors = ['#F472B6', '#34D399', '#60A5FA', '#FBBF24', '#A78BFA', '#F87171', '#2DD4BF', '#C084FC'];

            const isCurrentIdentity = isIdentity(currentPerm);

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-indigo-500/30 flex flex-col ${isResizing ? 'cursor-col-resize select-none' : ''}`}>
                
                {/* HEADER */}
                <header className="bg-slate-900 border-b border-slate-800 p-4 shadow-lg sticky top-0 z-10 shrink-0">
                    <div className="w-full px-4 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-3">
                        <div className="p-2 bg-indigo-500/20 rounded-lg border border-indigo-500/30">
                        <RotateCcw className="text-indigo-400" size={24} />
                        </div>
                        <h1 className="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                        Permutation Groups
                        </h1>
                    </div>
                    
                    <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                        <button
                            onClick={() => setMode('matrix')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-bold transition-all ${
                            mode === 'matrix' 
                                ? 'bg-indigo-600 text-white shadow-lg' 
                                : 'text-slate-400 hover:text-white hover:bg-slate-700'
                            }`}
                        >
                        <Grid3x3 size={16} /> Matrix
                        </button>
                        <button
                            onClick={() => setMode('explorer')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-bold transition-all ${
                            mode === 'explorer' 
                                ? 'bg-indigo-600 text-white shadow-lg' 
                                : 'text-slate-400 hover:text-white hover:bg-slate-700'
                            }`}
                        >
                        <Zap size={16} /> Explorer
                        </button>
                        <button
                            onClick={() => setMode('game')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-bold transition-all ${
                            mode === 'game' 
                                ? 'bg-indigo-600 text-white shadow-lg' 
                                : 'text-slate-400 hover:text-white hover:bg-slate-700'
                            }`}
                        >
                        <Search size={16} /> Find Order
                        </button>
                    </div>

                    <div className="flex items-center gap-6 text-sm font-medium">
                        {mode === 'game' && (
                        <div className="flex items-center gap-2 px-4 py-1.5 bg-slate-800 rounded-full border border-slate-700">
                            <Trophy size={16} className="text-yellow-400" />
                            <span>Score: <span className="text-white">{score}</span></span>
                        </div>
                        )}
                    </div>
                    </div>
                </header>

                {/* MAIN CONTENT AREA */}
                <main className="flex-1 w-full px-4 md:px-6 py-6 flex flex-col lg:flex-row items-stretch gap-0 h-[calc(100vh-80px)] overflow-hidden">
                    
                    {/* LEFT PANEL: GRAPH VISUALIZATION */}
                    <div className="flex-1 min-w-0 bg-slate-900/50 rounded-2xl border border-slate-800 p-4 md:p-8 flex flex-col items-center justify-center relative shadow-inner overflow-hidden mb-4 lg:mb-0 lg:mr-2">
                        
                        {/* Settings Overlay */}
                        <div className="absolute top-4 left-4 flex gap-1 z-10">
                            {mode === 'game' ? (
                            ['easy', 'medium', 'hard', 'expert'].map((d) => (
                                <button
                                key={d}
                                onClick={() => handleDifficulty(d)}
                                className={`text-xs uppercase font-bold px-3 py-1 rounded-md transition-all ${
                                    (d === 'easy' && n === 5) || (d === 'medium' && n === 6) || (d === 'hard' && n === 7) || (d === 'expert' && n === 12)
                                    ? 'bg-indigo-600 text-white shadow' 
                                    : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                                }`}
                                >
                                {d}
                                </button>
                            ))
                            ) : (
                            <div className="flex items-center gap-2 bg-slate-800 rounded-md px-2 py-1 border border-slate-700">
                                <span className="text-xs text-slate-400 font-bold uppercase">Size (n)</span>
                                <button onClick={() => setN(Math.max(3, n-1))} className="p-1 hover:bg-slate-700 rounded"><ChevronDown size={14}/></button>
                                <span className="text-sm font-mono w-4 text-center">{n}</span>
                                <button onClick={() => setN(Math.min(12, n+1))} className="p-1 hover:bg-slate-700 rounded"><ChevronUp size={14}/></button>
                            </div>
                            )}
                        </div>

                        {/* GRAPH SVG */}
                        <div className="relative group w-full h-full flex items-center justify-center">
                            <svg 
                            ref={svgRef}
                            viewBox="0 0 400 400" 
                            className="w-full h-full max-h-[80vh] aspect-square select-none"
                            preserveAspectRatio="xMidYMid meet"
                            >
                            <defs>
                                <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="22" refY="2" orient="auto">
                                <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
                                </marker>
                                {cycles.map((_, idx) => (
                                <marker 
                                    key={`marker-${idx}`} 
                                    id={`arrowhead-${idx}`} 
                                    markerWidth="6" 
                                    markerHeight="4" 
                                    refX="22" 
                                    refY="2" 
                                    orient="auto"
                                >
                                    <polygon points="0 0, 6 2, 0 4" fill={cycleColors[idx % cycleColors.length]} />
                                </marker>
                                ))}
                            </defs>

                            {currentPerm.map((target, source) => {
                                const cycleIdx = cycles.findIndex(c => c.includes(source));
                                let showColor = false;
                                if (mode === 'explorer' || mode === 'matrix') {
                                    showColor = true;
                                    if (highlightedCycleIndex !== null && highlightedCycleIndex !== cycleIdx) showColor = false; 
                                } else {
                                    const isHighlighted = highlightedCycleIndex !== null && cycles[highlightedCycleIndex].includes(source);
                                    const isFound = foundCycles.has(cycleIdx);
                                    showColor = isHighlighted || isFound;
                                }

                                return (
                                <g key={`path-${source}`}>
                                    <path
                                    d={getArrowPath(source, target, n)}
                                    fill="none"
                                    stroke={showColor ? cycleColors[cycleIdx % cycleColors.length] : "#334155"}
                                    strokeWidth={showColor ? 3 : 1.5}
                                    strokeOpacity={showColor ? 1 : 0.4}
                                    markerEnd={`url(#${showColor ? `arrowhead-${cycleIdx}` : 'arrowhead'})`}
                                    className="transition-all duration-300 ease-in-out"
                                    />
                                </g>
                                );
                            })}

                            {Array.from({ length: n }).map((_, i) => {
                                const pos = getNodePos(i, n);
                                const cycleIdx = cycles.findIndex(c => c.includes(i));
                                let isColored = false;
                                if (mode === 'explorer' || mode === 'matrix') {
                                    isColored = true;
                                    if (highlightedCycleIndex !== null && highlightedCycleIndex !== cycleIdx) isColored = false;
                                } else {
                                    const isHighlighted = highlightedCycleIndex === cycleIdx;
                                    const isFound = foundCycles.has(cycleIdx);
                                    isColored = isHighlighted || isFound;
                                }

                                const color = isColored ? cycleColors[cycleIdx % cycleColors.length] : '#475569';
                                const strokeWidth = (mode === 'explorer' && highlightedCycleIndex === cycleIdx) ? 4 : 2;

                                return (
                                <g 
                                    key={`node-${i}`} 
                                    onClick={() => handleNodeClick(i)}
                                    className="cursor-pointer hover:brightness-110 transition-all"
                                >
                                    <circle
                                    cx={pos.x}
                                    cy={pos.y}
                                    r="16"
                                    fill="#1e293b"
                                    stroke={color}
                                    strokeWidth={strokeWidth}
                                    className="transition-all duration-300"
                                    />
                                    <text
                                    x={pos.x}
                                    y={pos.y}
                                    dy="5"
                                    textAnchor="middle"
                                    fill={isColored ? '#fff' : '#94a3b8'}
                                    fontSize="14"
                                    fontWeight="bold"
                                    className="pointer-events-none"
                                    >
                                    {i + 1}
                                    </text>
                                </g>
                                );
                            })}
                            </svg>
                            
                            {(mode === 'explorer' || mode === 'matrix') && (
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center pointer-events-none">
                                    <div className={`
                                        w-6 h-6 rounded-full shadow-lg mb-2 transition-all duration-500
                                        ${isCurrentIdentity 
                                            ? 'bg-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.8)] scale-110' 
                                            : 'bg-slate-800 border border-slate-700 opacity-50'}
                                    `}></div>
                                    {isCurrentIdentity && <span className="text-emerald-400 text-xs font-bold tracking-wider">IDENTITY</span>}
                                </div>
                            )}
                        </div>

                        {/* Cycle Notation Display (Shown in Explorer Mode) */}
                        {mode === 'explorer' && (
                            <div className="absolute bottom-6 w-auto bg-slate-950/80 backdrop-blur p-4 rounded-lg border border-slate-800 font-mono text-sm space-y-2 max-w-[90%] z-20 shadow-xl">
                                <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-thin">
                                    <span className="text-slate-500 font-bold shrink-0">x =</span>
                                    <span className="text-indigo-300 whitespace-nowrap">
                                    {formatCycleNotation(baseCycles)}
                                    </span>
                                </div>
                                <div className="flex items-center gap-2 border-t border-slate-800 pt-2 overflow-x-auto scrollbar-thin">
                                    <span className="text-slate-500 font-bold shrink-0">x<sup>{exponent}</sup> =</span>
                                    <span className="text-emerald-300 whitespace-nowrap">
                                    {formatCycleNotation(cycles)}
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* DRAGGER HANDLE (Visible on Large Screens) */}
                    <div 
                        className="resizer-handle hidden lg:flex w-4 cursor-col-resize items-center justify-center hover:bg-slate-800/50 rounded transition-colors group z-20"
                        onMouseDown={startResizing}
                    >
                        <div className="w-1 h-12 bg-slate-700 rounded-full group-hover:bg-indigo-500 transition-colors"></div>
                    </div>

                    {/* RIGHT PANEL: INTERACTION & MATRIX */}
                    <div 
                        className="flex flex-col gap-4 shrink-0 overflow-y-auto"
                        style={{ 
                            // Use CSS variable for width on large screens, simpler than conditional width
                            '--sidebar-width': `${sidebarWidth}px` 
                        }}
                    >
                        {/* Wrapper for responsive width logic */}
                        <div className="w-full lg:w-[var(--sidebar-width)] flex flex-col gap-4">
                        
                            {/* MATRIX MODE PANEL */}
                            {mode === 'matrix' && (
                                <div className="flex flex-col gap-4">
                                    {/* Cycle Notation Box */}
                                    <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl">
                                        <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Cycle Notation</h2>
                                        <div className="font-mono text-sm space-y-2 overflow-x-auto scrollbar-thin">
                                            <div className="whitespace-nowrap">
                                                <span className="text-slate-500 mr-2">x =</span>
                                                <span className="text-indigo-300">{formatCycleNotation(baseCycles)}</span>
                                            </div>
                                            <div className="pt-2 border-t border-slate-700 whitespace-nowrap">
                                                <span className="text-slate-500 mr-2">x<sup>{exponent}</sup> =</span>
                                                <span className="text-emerald-400">{formatCycleNotation(cycles)}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Matrix Grid Box */}
                                    <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl">
                                        <div className="flex items-center justify-between mb-4">
                                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Permutation Matrix</h2>
                                            <button 
                                                onClick={generateNewBase}
                                                className="text-[10px] uppercase font-bold tracking-wider bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300 transition-colors"
                                            >
                                                Randomize
                                            </button>
                                        </div>
                                        
                                        <div className="flex justify-center bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 overflow-x-auto">
                                            <div 
                                                className="grid gap-1"
                                                style={{ 
                                                    gridTemplateColumns: `auto repeat(${n}, minmax(20px, 1fr))`,
                                                    maxWidth: '100%'
                                                }}
                                            >
                                                {/* Header Row */}
                                                <div className="w-4"></div>
                                                {Array.from({length: n}, (_, i) => (
                                                    <div key={`h${i}`} className="text-[10px] text-slate-500 text-center font-mono">{i+1}</div>
                                                ))}

                                                {/* Matrix Rows */}
                                                {Array.from({length: n}, (_, row) => (
                                                    <React.Fragment key={`row${row}`}>
                                                        <div className="text-[10px] text-slate-500 font-mono flex items-center justify-end pr-1">{row+1}</div>
                                                        {Array.from({length: n}, (_, col) => {
                                                            const isActive = currentPerm[row] === col;
                                                            const cycleIdx = cycles.findIndex(c => c.includes(row));
                                                            const color = isActive ? cycleColors[cycleIdx % cycleColors.length] : null;

                                                            return (
                                                                <div 
                                                                    key={`${row}-${col}`}
                                                                    className={`
                                                                        aspect-square rounded-sm flex items-center justify-center text-[10px] font-bold transition-all duration-200
                                                                        ${isActive ? 'bg-opacity-100 text-white shadow-sm scale-105' : 'bg-slate-800/50 text-slate-700'}
                                                                    `}
                                                                    style={{ 
                                                                        backgroundColor: isActive ? color : undefined,
                                                                        boxShadow: isActive ? `0 0 8px ${color}40` : 'none'
                                                                    }}
                                                                >
                                                                    {isActive ? 1 : 0}
                                                                </div>
                                                            );
                                                        })}
                                                    </React.Fragment>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="mt-2 text-center space-y-2">
                                            <p className="text-[10px] text-slate-500 italic">
                                                P<sub>ij</sub> = 1 if j = &sigma;(i)
                                            </p>
                                            <p className="text-xs text-slate-400 border-t border-slate-700/50 pt-2 mt-2">
                                                This permutation matrix is constructed by permuting the columns of the identity matrix. Multiplying any matrix by this permutation matrix from the right permutes its columns in the same way.
                                            </p>
                                        </div>
                                    </div>

                                    {/* Mini Explorer Controls for Matrix Mode */}
                                    <div className="bg-slate-800 rounded-xl p-3 border border-slate-700 shadow-xl flex items-center justify-between gap-2">
                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider pl-1">Power</span>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => setExponent(e => e - 1)} className="p-1 hover:bg-slate-700 rounded text-slate-300"><ChevronDown size={16}/></button>
                                            <span className="font-mono font-bold w-8 text-center">{exponent}</span>
                                            <button onClick={() => setExponent(e => e + 1)} className="p-1 hover:bg-slate-700 rounded text-slate-300"><ChevronUp size={16}/></button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* EXPLORER MODE PANEL */}
                            {mode === 'explorer' && (
                                <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl space-y-4">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-sm font-bold text-white flex items-center gap-2">
                                            <Zap size={16} className="text-indigo-400" /> 
                                            Cycle Powers
                                        </h2>
                                        <button 
                                            onClick={generateNewBase}
                                            className="text-[10px] uppercase font-bold tracking-wider bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300 transition-colors"
                                        >
                                            New Random
                                        </button>
                                    </div>

                                    <div className="flex flex-col items-center justify-center py-3 bg-slate-900/50 rounded-xl border border-slate-700/50">
                                        <span className="text-slate-500 text-[10px] mb-1 font-bold uppercase tracking-widest">EXPONENT (i)</span>
                                        
                                        <div className="flex items-center gap-3">
                                            <button 
                                                onClick={() => setExponent(e => e - 1)}
                                                className="p-1.5 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg transition-all active:scale-95 shadow border border-slate-700"
                                            >
                                                <ChevronDown size={20} />
                                            </button>

                                            <div className="text-3xl font-mono font-bold text-white w-16 text-center tabular-nums">
                                                {exponent}
                                            </div>

                                            <button 
                                                onClick={() => setExponent(e => e + 1)}
                                                className="p-1.5 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg transition-all active:scale-95 shadow border border-slate-700"
                                            >
                                                <ChevronUp size={20} />
                                            </button>
                                        </div>

                                        <div className="mt-2 text-center h-6">
                                            <p className="text-sm text-indigo-300 font-serif italic">
                                                x <sup>{exponent}</sup> {isCurrentIdentity ? '= e' : ''}
                                            </p>
                                        </div>
                                    </div>

                                    <div className={`p-3 rounded-lg border transition-all duration-300 ${
                                        isCurrentIdentity 
                                            ? 'bg-emerald-500/10 border-emerald-500/30' 
                                            : 'bg-slate-700/30 border-slate-700'
                                    }`}>
                                        <div className="flex items-start gap-2">
                                            <div className={`p-1.5 rounded-full shrink-0 ${isCurrentIdentity ? 'bg-emerald-500 text-white' : 'bg-slate-600 text-slate-400'}`}>
                                                {isCurrentIdentity ? <Check size={14} /> : <RotateCcw size={14} />}
                                            </div>
                                            <div>
                                                <h3 className={`text-sm font-bold ${isCurrentIdentity ? 'text-emerald-400' : 'text-slate-300'}`}>
                                                    {isCurrentIdentity ? 'Identity Reached!' : 'Applying Permutation'}
                                                </h3>
                                                <p className="text-xs text-slate-400 mt-0.5 leading-relaxed">
                                                    {isCurrentIdentity 
                                                        ? `After ${Math.abs(exponent)} steps, all elements return home.` 
                                                        : `Mapping for power ${Math.abs(exponent)}.`}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* GAME MODE PANEL */}
                            {mode === 'game' && (
                                <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
                                    <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                    <Calculator size={20} className="text-indigo-400" /> 
                                    Analysis
                                    </h2>
                                    
                                    <div className="space-y-6">
                                    <div>
                                        <p className="text-sm text-slate-400 mb-2">Discovered Cycles:</p>
                                        <div className="flex flex-wrap gap-2 min-h-[40px]">
                                        {foundCycles.size === 0 ? (
                                            <span className="text-slate-600 italic text-sm">Tap nodes to reveal cycles...</span>
                                        ) : (
                                            Array.from(foundCycles).sort((a,b) => a-b).map(idx => {
                                            const len = cycles[idx].length;
                                            return (
                                                <div key={idx} className="bg-slate-900 border border-slate-600 px-3 py-1 rounded text-sm text-white flex items-center gap-2 shadow-sm animate-in zoom-in duration-200">
                                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: cycleColors[idx % cycleColors.length] }}></span>
                                                Length: <span className="font-bold text-indigo-300">{len}</span>
                                                </div>
                                            );
                                            })
                                        )}
                                        </div>
                                    </div>

                                    <div className="border-t border-slate-700 pt-6">
                                        <label className="block text-sm font-medium text-slate-300 mb-2">
                                        What is the Order of this permutation?
                                        </label>
                                        <form onSubmit={handleSubmit} className="flex gap-2">
                                        <input
                                            type="number"
                                            value={userAnswer}
                                            onChange={(e) => setUserAnswer(e.target.value)}
                                            placeholder="Enter LCM..."
                                            className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                                            disabled={gameStatus === 'won'}
                                        />
                                        <button
                                            type="submit"
                                            disabled={!userAnswer || gameStatus === 'won'}
                                            className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-2 rounded-lg font-bold transition-all shadow-lg shadow-indigo-500/20"
                                        >
                                            Check
                                        </button>
                                        </form>
                                    </div>

                                    {feedback === 'correct' && (
                                        <div className="bg-emerald-500/10 border border-emerald-500/50 rounded-lg p-4 flex items-start gap-3 animate-in fade-in slide-in-from-bottom-2">
                                        <div className="bg-emerald-500 rounded-full p-1 mt-0.5">
                                            <Check size={14} className="text-white" />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-emerald-400">Correct!</h3>
                                            <p className="text-sm text-emerald-200/80 mt-1">
                                            Great job!
                                            </p>
                                            <button 
                                            onClick={generateNewBase}
                                            className="mt-3 text-sm bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-md font-medium transition-colors"
                                            >
                                            Next Puzzle
                                            </button>
                                        </div>
                                        </div>
                                    )}

                                    {feedback === 'incorrect' && (
                                        <div className="bg-rose-500/10 border border-rose-500/50 rounded-lg p-4 flex items-center gap-3 animate-in shake">
                                        <X size={20} className="text-rose-400" />
                                        <div>
                                            <h3 className="font-bold text-rose-400">Not quite</h3>
                                            <p className="text-sm text-rose-200/80">Check your calculation.</p>
                                        </div>
                                        </div>
                                    )}
                                    </div>
                                    <button 
                                    onClick={generateNewBase} 
                                    className="mt-4 self-end text-slate-500 hover:text-white text-sm flex items-center gap-2 transition-colors w-full justify-center py-2 hover:bg-slate-800 rounded"
                                    >
                                    Skip Puzzle <Play size={14} />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CycleScout />);
    </script>
</body>
</html>
