<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Descent Visualiser — Interactive Optimisation Tool</title>
    <meta name="description" content="Interactive gradient descent visualiser. Drag a ball on any function, adjust the learning rate, and watch the optimisation algorithm find minima step by step.">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons (Inline SVGs to avoid dependencies) ---
        const IconWrapper = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {children}
            </svg>
        );

        const Play = (props) => <IconWrapper {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconWrapper>;
        const Pause = (props) => <IconWrapper {...props}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></IconWrapper>;
        const RefreshCw = (props) => <IconWrapper {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></IconWrapper>;
        const StepForward = (props) => <IconWrapper {...props}><line x1="6" y1="4" x2="6" y2="20"></line><polygon points="10 4 20 12 10 20 10 4"></polygon></IconWrapper>;
        const TrendingDown = (props) => <IconWrapper {...props}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></IconWrapper>;
        const Info = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconWrapper>;
        const Settings = (props) => <IconWrapper {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></IconWrapper>;
        const AlertCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></IconWrapper>;
        const ZoomIn = (props) => <IconWrapper {...props}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></IconWrapper>;
        const ZoomOut = (props) => <IconWrapper {...props}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></IconWrapper>;


        // --- Main Component ---
        const GradientDescentGame = () => {
            // --- State ---
            const [funcStr, setFuncStr] = useState("0.1*x^4 - 1.5*x^2 + 0.3*x");
            const [learningRate, setLearningRate] = useState(0.1);
            const [currentX, setCurrentX] = useState(-2.5);
            const [isPlaying, setIsPlaying] = useState(false);
            const [history, setHistory] = useState([]); // Array of {x, y}
            const [iteration, setIteration] = useState(0);
            const [zoom, setZoom] = useState(0.7);
            const [isDragging, setIsDragging] = useState(false);
            
            // Canvas Refs
            const canvasRef = useRef(null);
            
            // Constants for Viewport (Derived from Zoom)
            const BASE_RANGE = 5;
            const X_MIN = -BASE_RANGE / zoom;
            const X_MAX = BASE_RANGE / zoom;
            const Y_MIN = -BASE_RANGE / zoom;
            const Y_MAX = BASE_RANGE / zoom;
            
            const WIDTH = 800;
            const HEIGHT = 500;

            // --- Math Logic ---

            // robust evaluate function
            const evaluate = useCallback((expression, xVal) => {
                try {
                // sanitize and prepare string for JS evaluation
                let processed = expression
                    .toLowerCase()
                    // Handle powers: x^2 -> x**2
                    .replace(/\^/g, '**')
                    // Handle implicit multiplication: 2x -> 2*x
                    .replace(/(\d)(x)/g, '$1*$2')
                    .replace(/(x)(\d)/g, '$1*$2')
                    // Wrap Math functions
                    .replace(/sin/g, 'Math.sin')
                    .replace(/cos/g, 'Math.cos')
                    .replace(/tan/g, 'Math.tan')
                    .replace(/abs/g, 'Math.abs')
                    .replace(/exp/g, 'Math.exp')
                    .replace(/log/g, 'Math.log')
                    .replace(/sqrt/g, 'Math.sqrt')
                    .replace(/pi/g, 'Math.PI')
                    .replace(/e/g, 'Math.E');

                // Create a function from the string
                const f = new Function('x', `return ${processed};`);
                const result = f(xVal);
                
                if (isNaN(result) || !isFinite(result)) return null;
                return result;
                } catch (err) {
                return null;
                }
            }, []);

            // Numerical Derivative: f'(x) ≈ (f(x+h) - f(x-h)) / 2h
            const getGradient = useCallback((expression, x) => {
                const h = 0.0001;
                const y1 = evaluate(expression, x + h);
                const y2 = evaluate(expression, x - h);
                if (y1 === null || y2 === null) return 0;
                return (y1 - y2) / (2 * h);
            }, [evaluate]);

            // Find Minima for visualization
            const findMinima = useCallback((expression) => {
                const minima = [];
                // Adjust step size based on zoom
                const step = 0.05 / zoom; 
                let prevSlope = getGradient(expression, X_MIN);
                
                for (let x = X_MIN; x <= X_MAX; x += step) {
                const slope = getGradient(expression, x);
                // If slope changes from negative to positive, we found a local minimum
                if (prevSlope < 0 && slope >= 0) {
                    const y = evaluate(expression, x);
                    if (y !== null) {
                    minima.push({ x, y });
                    }
                }
                prevSlope = slope;
                }
                
                // Identify global min among the locals found in view
                if (minima.length > 0) {
                let minVal = minima[0].y;
                minima.forEach(m => minVal = Math.min(minVal, m.y));
                minima.forEach(m => m.isGlobal = Math.abs(m.y - minVal) < 0.01);
                }
                return minima;
            }, [evaluate, getGradient, X_MIN, X_MAX, zoom]);

            // --- Coordinates Mapping ---
            const mapX = useCallback((x) => ((x - X_MIN) / (X_MAX - X_MIN)) * WIDTH, [X_MIN, X_MAX]);
            const mapY = useCallback((y) => HEIGHT - ((y - Y_MIN) / (Y_MAX - Y_MIN)) * HEIGHT, [Y_MIN, Y_MAX]);
            const unmapX = useCallback((px) => (px / WIDTH) * (X_MAX - X_MIN) + X_MIN, [X_MIN, X_MAX]);

            // --- Game Loop / Logic ---

            const performStep = useCallback(() => {
                const slope = getGradient(funcStr, currentX);
                
                // Gradient Descent Formula
                const nextX = currentX - (learningRate * slope);
                
                if (Math.abs(nextX) > 1000) {
                setIsPlaying(false);
                return;
                }

                const currentY = evaluate(funcStr, currentX);
                setHistory(prev => [...prev, { x: currentX, y: currentY }]);
                setCurrentX(nextX);
                setIteration(prev => prev + 1);
            }, [currentX, funcStr, learningRate, getGradient, evaluate]);

            useEffect(() => {
                if (isPlaying) {
                const timer = setInterval(() => {
                    performStep();
                }, 200); 
                return () => clearInterval(timer);
                }
            }, [isPlaying, performStep]);

            // --- Drawing ---
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                
                // 1. Draw Grid & Axes
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 1;
                ctx.beginPath();
                
                const gridStep = zoom > 2 ? 0.5 : 1; 
                
                for (let x = Math.ceil(X_MIN); x <= Math.floor(X_MAX); x += gridStep) {
                ctx.moveTo(mapX(x), 0);
                ctx.lineTo(mapX(x), HEIGHT);
                }
                for (let y = Math.ceil(Y_MIN); y <= Math.floor(Y_MAX); y += gridStep) {
                ctx.moveTo(0, mapY(y));
                ctx.lineTo(WIDTH, mapY(y));
                }
                ctx.stroke();

                // Axes
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (X_MIN <= 0 && X_MAX >= 0) {
                ctx.moveTo(mapX(0), 0);
                ctx.lineTo(mapX(0), HEIGHT); 
                }
                if (Y_MIN <= 0 && Y_MAX >= 0) {
                ctx.moveTo(0, mapY(0));
                ctx.lineTo(WIDTH, mapY(0)); 
                }
                ctx.stroke();

                // 2. Draw Function Curve
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 3;
                ctx.beginPath();
                let isDrawing = false;
                for (let px = 0; px <= WIDTH; px++) {
                const x = unmapX(px);
                const y = evaluate(funcStr, x);
                
                if (y === null || y > Y_MAX + (Y_MAX-Y_MIN) || y < Y_MIN - (Y_MAX-Y_MIN)) {
                    isDrawing = false;
                    continue;
                }
                
                if (!isDrawing) {
                    ctx.moveTo(px, mapY(y));
                    isDrawing = true;
                } else {
                    ctx.lineTo(px, mapY(y));
                }
                }
                ctx.stroke();

                // 3. Draw Minima Markers
                const minima = findMinima(funcStr);
                minima.forEach(m => {
                const mx = mapX(m.x);
                const my = mapY(m.y);
                
                ctx.fillStyle = m.isGlobal ? '#10b981' : '#f59e0b';
                ctx.beginPath();
                ctx.arc(mx, my, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Label
                ctx.fillStyle = '#374151';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(m.isGlobal ? 'Global Min' : 'Local Min', mx, my + 20);
                });

                // 4. Draw History Path
                if (history.length > 0) {
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                history.forEach((pt, i) => {
                    if (i === 0) ctx.moveTo(mapX(pt.x), mapY(pt.y));
                    else ctx.lineTo(mapX(pt.x), mapY(pt.y));
                });
                ctx.lineTo(mapX(currentX), mapY(evaluate(funcStr, currentX)));
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
                history.forEach(pt => {
                    if (pt.x >= X_MIN && pt.x <= X_MAX && pt.y >= Y_MIN && pt.y <= Y_MAX) {
                    ctx.beginPath();
                    ctx.arc(mapX(pt.x), mapY(pt.y), 3, 0, Math.PI*2);
                    ctx.fill();
                    }
                });
                }

                // 5. Draw Current Ball & Tangent
                const cy = evaluate(funcStr, currentX);
                if (cy !== null) {
                const inView = currentX >= X_MIN && currentX <= X_MAX && cy >= Y_MIN && cy <= Y_MAX;
                
                if (inView) {
                    const cxPos = mapX(currentX);
                    const cyPos = mapY(cy);
                    
                    // Tangent
                    const slope = getGradient(funcStr, currentX);
                    const delta = 0.5 / zoom; 
                    const x1 = currentX - delta;
                    const y1 = cy - slope * delta; 
                    const x2 = currentX + delta;
                    const y2 = cy + slope * delta;
                    
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(mapX(x1), mapY(y1));
                    ctx.lineTo(mapX(x2), mapY(y2));
                    ctx.stroke();

                    // Ball
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(cxPos, cyPos, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                }

            }, [funcStr, currentX, history, findMinima, evaluate, getGradient, mapX, mapY, unmapX, X_MIN, X_MAX, Y_MIN, Y_MAX, zoom, WIDTH, HEIGHT]);

            // --- Handlers ---

            const updateBallPos = (clientX) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const x = clientX - rect.left;
                const mathX = unmapX(x);
                
                setHistory([]);
                setIteration(0);
                setCurrentX(mathX);
            };

            const handleMouseDown = (e) => {
                setIsDragging(true);
                setIsPlaying(false);
                updateBallPos(e.clientX);
            };

            const handleMouseMove = (e) => {
                if (isDragging) {
                updateBallPos(e.clientX);
                }
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const handleMouseLeave = () => {
                setIsDragging(false);
            };

            const generateRandomFunction = () => {
                const funcs = [
                "0.1*x^4 - 1.5*x^2 + 0.3*x", 
                "x^2 + 2*sin(3*x)",          
                "0.05*x^4 - 0.5*x^2 + sin(x)", 
                "cos(x) + 0.2*x^2",          
                "0.5 * (x-2)^2 + sin(5*x) * 0.5" 
                ];
                const rand = funcs[Math.floor(Math.random() * funcs.length)];
                setFuncStr(rand);
                reset();
            };

            const reset = () => {
                setIsPlaying(false);
                setHistory([]);
                setIteration(0);
                setCurrentX((Math.random() * (X_MAX - X_MIN)) + X_MIN);
            };

            const togglePlay = () => setIsPlaying(!isPlaying);

            const handleZoomIn = () => setZoom(z => Math.min(z * 1.5, 10)); 
            const handleZoomOut = () => setZoom(z => Math.max(z / 1.5, 0.2)); 

            return (
                <div className="flex flex-col items-center min-h-screen bg-slate-50 p-4 font-sans text-slate-800">
                
                {/* Header */}
                <div className="w-full max-w-4xl mb-6">
                    <h1 className="text-3xl font-bold text-slate-900 flex items-center gap-2">
                    <TrendingDown className="text-blue-600" />
                    Gradient Descent Visualiser
                    </h1>
                    <p className="text-slate-600 mt-2">
                    An interactive simulation to learn how optimisation algorithms find minima.
                    </p>
                </div>

                {/* Main Simulation Area */}
                <div className="bg-white p-2 rounded-xl shadow-lg border border-slate-200 w-full max-w-4xl relative group select-none">
                    <canvas
                    ref={canvasRef}
                    width={WIDTH}
                    height={HEIGHT}
                    className={`w-full h-auto rounded-lg bg-white touch-none ${isDragging ? 'cursor-grabbing' : 'cursor-grab active:cursor-grabbing'}`}
                    onMouseDown={handleMouseDown}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseLeave}
                    />
                    
                    {/* Info Overlay */}
                    <div className="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-2 rounded-lg text-sm shadow-sm border border-slate-200 pointer-events-none select-none">
                    <p className="font-semibold text-slate-700">Coordinates</p>
                    <div className="font-mono text-xs mt-1 space-y-1">
                        <p>x: {currentX.toFixed(4)}</p>
                        <p>y: {evaluate(funcStr, currentX)?.toFixed(4)}</p>
                        <p>∇: {getGradient(funcStr, currentX).toFixed(4)}</p>
                        <p className="text-slate-400 mt-1">Iteration: {iteration}</p>
                    </div>
                    </div>

                    {/* Zoom Controls Overlay */}
                    <div className="absolute bottom-4 right-4 flex flex-col gap-2">
                    <button 
                        onClick={handleZoomIn}
                        className="bg-white/90 hover:bg-white shadow-md border border-slate-200 p-2 rounded-lg text-slate-600 transition-colors"
                        title="Zoom In"
                    >
                        <ZoomIn size={20} />
                    </button>
                    <button 
                        onClick={handleZoomOut}
                        className="bg-white/90 hover:bg-white shadow-md border border-slate-200 p-2 rounded-lg text-slate-600 transition-colors"
                        title="Zoom Out"
                    >
                        <ZoomOut size={20} />
                    </button>
                    </div>
                    
                    {/* Helper overlay text */}
                    {!isPlaying && iteration === 0 && !isDragging && (
                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-blue-600/90 text-white px-4 py-2 rounded-full pointer-events-none animate-pulse select-none">
                        Drag to move the ball
                    </div>
                    )}
                </div>

                {/* Controls Panel */}
                <div className="w-full max-w-4xl mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    {/* Simulation Settings */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div className="flex items-center gap-2 mb-4 text-slate-900 font-semibold border-b pb-2">
                        <Settings size={18} /> Configuration
                    </div>
                    
                    <div className="space-y-4">
                        <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                            Function f(x)
                        </label>
                        <div className="flex gap-2">
                            <input
                            type="text"
                            value={funcStr}
                            onChange={(e) => {
                                setFuncStr(e.target.value);
                                setHistory([]);
                                setIteration(0);
                            }}
                            className="flex-1 p-2 border border-slate-300 rounded font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                            />
                            <button 
                            onClick={generateRandomFunction}
                            className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded"
                            title="Random Function"
                            >
                            <RefreshCw size={18} />
                            </button>
                        </div>
                        </div>

                        <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1 flex justify-between">
                            <span>Learning Rate (Step Size): {learningRate.toFixed(3)}</span>
                            {learningRate > 0.8 && <span className="text-amber-600 text-xs flex items-center gap-1"><AlertCircle size={12}/> High (Risk of overshoot)</span>}
                        </label>
                        <input
                            type="range"
                            min="0.01"
                            max="1.5"
                            step="0.01"
                            value={learningRate}
                            onChange={(e) => setLearningRate(parseFloat(e.target.value))}
                            className="w-full accent-blue-600"
                        />
                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                            <span>Safe (0.01)</span>
                            <span>Chaotic (1.5)</span>
                        </div>
                        </div>
                    </div>
                    </div>

                    {/* Playback Controls */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                    <div className="flex items-center gap-2 mb-4 text-slate-900 font-semibold border-b pb-2">
                        <Play size={18} /> Simulation Control
                    </div>

                    <div className="flex items-center justify-center gap-4 flex-1">
                        <button
                        onClick={togglePlay}
                        className={`flex items-center gap-2 px-6 py-3 rounded-full font-bold text-white transition-all shadow-md active:scale-95 ${
                            isPlaying 
                            ? 'bg-amber-500 hover:bg-amber-600' 
                            : 'bg-green-600 hover:bg-green-700'
                        }`}
                        >
                        {isPlaying ? <><Pause size={20} /> Pause</> : <><Play size={20} /> Start Descent</>}
                        </button>

                        <button
                        onClick={performStep}
                        disabled={isPlaying}
                        className="p-3 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                        title="Step Forward"
                        >
                        <StepForward size={20} />
                        </button>

                        <button
                        onClick={reset}
                        className="p-3 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors"
                        title="Reset Position"
                        >
                        <RefreshCw size={20} />
                        </button>
                    </div>
                    
                    <div className="mt-4 bg-blue-50 p-3 rounded text-xs text-blue-800 flex items-start gap-2">
                        <Info size={16} className="shrink-0 mt-0.5" />
                        <p>
                        <strong>Formula:</strong> <code>x<sub>new</sub> = x<sub>old</sub> - α · f'(x)</code><br/>
                        Where <code>α</code> is the learning rate and <code>f'(x)</code> is the slope. 
                        The ball rolls "downhill" opposite to the slope.
                        </p>
                    </div>
                    </div>
                </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GradientDescentGame />);
    </script>
</body>
</html>
