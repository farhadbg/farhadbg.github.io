<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finite Generation — Gordan's Lemma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        canvas { touch-action: none; cursor: crosshair; }
        .controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="controls p-3 shadow-sm z-10">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-base font-bold text-slate-800">Interactive: Finite Generation &mdash; Gordan's Lemma</h1>
                <p class="text-xs text-slate-500">
                    Drag <span class="text-blue-600 font-semibold">v<sub>1</sub></span> and
                    <span class="text-emerald-600 font-semibold">v<sub>2</sub></span> to set the cone &sigma;.
                    Click any lattice point inside the cone to add it as a <span class="text-purple-600 font-semibold">generator</span>; click again to remove it.
                    <span class="font-semibold" style="color:#4d6b14;">Olive dots</span> = lattice points reached by the current generators.
                </p>
            </div>

            <div class="flex gap-2">
                <button id="clear-extras-btn" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded text-sm transition-colors" title="Remove all extra generators">Clear extras</button>
                <button id="reset-btn" class="px-3 py-1 bg-slate-200 hover:bg-slate-300 rounded text-sm transition-colors" title="Reset everything">Reset</button>
                <button id="zoom-in" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded text-sm">+</button>
                <button id="zoom-out" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded text-sm">-</button>
            </div>
        </div>
    </div>

    <div class="flex-grow relative overflow-hidden" id="canvas-container">
        <canvas id="gridCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // State
        let v1 = { x: 1, y: 2 };
        let v2 = { x: 3, y: 1 };
        let extras = []; // user-added generators inside the cone
        let scale = 50;
        let offset = { x: 0, y: 0 };
        let dragging = null;       // 'v1' or 'v2'
        let pressStart = null;     // for distinguishing click from drag

        function init() {
            resize();
            window.addEventListener('resize', resize);

            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);

            canvas.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                onMouseDown({ clientX: t.clientX, clientY: t.clientY });
                e.preventDefault();
            }, { passive: false });
            window.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                onMouseMove({ clientX: t.clientX, clientY: t.clientY });
            }, { passive: false });
            window.addEventListener('touchend', (e) => {
                const last = e.changedTouches[0];
                onMouseUp({ clientX: last.clientX, clientY: last.clientY });
            });

            document.getElementById('reset-btn').onclick = () => {
                v1 = { x: 1, y: 2 };
                v2 = { x: 3, y: 1 };
                extras = [];
                draw();
            };
            document.getElementById('clear-extras-btn').onclick = () => {
                extras = [];
                draw();
            };
            document.getElementById('zoom-in').onclick = () => { scale *= 1.2; draw(); };
            document.getElementById('zoom-out').onclick = () => { scale /= 1.2; draw(); };

            draw();
        }

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            offset.x = canvas.width / 4;
            offset.y = canvas.height * 0.75;
            draw();
        }

        function toScreen(x, y) {
            return { x: offset.x + x * scale, y: offset.y - y * scale };
        }
        function toWorld(sx, sy) {
            return { x: (sx - offset.x) / scale, y: (offset.y - sy) / scale };
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function onMouseDown(e) {
            const m = getMousePos(e);
            const w = toWorld(m.x, m.y);
            const d1 = Math.hypot(w.x - v1.x, w.y - v1.y) * scale;
            const d2 = Math.hypot(w.x - v2.x, w.y - v2.y) * scale;
            const HIT = 18;
            if (d1 < HIT) dragging = 'v1';
            else if (d2 < HIT) dragging = 'v2';
            else dragging = null;
            pressStart = { x: m.x, y: m.y };
        }

        function onMouseMove(e) {
            if (!dragging) return;
            const m = getMousePos(e);
            const w = toWorld(m.x, m.y);
            const sx = Math.round(w.x), sy = Math.round(w.y);
            if (dragging === 'v1') { v1 = { x: sx, y: sy }; }
            else if (dragging === 'v2') { v2 = { x: sx, y: sy }; }
            draw();
        }

        function onMouseUp(e) {
            const wasDragging = dragging !== null;
            dragging = null;
            if (!pressStart) return;
            const m = getMousePos(e);
            const dist = Math.hypot(m.x - pressStart.x, m.y - pressStart.y);
            pressStart = null;
            // If the mouse moved very little and we weren't dragging a vector head,
            // treat as a click — toggle a generator at the nearest lattice point.
            if (!wasDragging && dist < 5) handleLatticeClick(m);
        }

        function handleLatticeClick(m) {
            const w = toWorld(m.x, m.y);
            const sx = Math.round(w.x), sy = Math.round(w.y);
            // ignore if too far from a lattice point (e.g., on edge)
            if (Math.hypot(w.x - sx, w.y - sy) > 0.35) return;
            if (sx === 0 && sy === 0) return; // origin doesn't count
            if (sx === v1.x && sy === v1.y) return; // v1 already a generator
            if (sx === v2.x && sy === v2.y) return; // v2 already a generator
            if (!inCone(sx, sy)) return;            // outside σ → ignore
            // toggle extras
            const idx = extras.findIndex(p => p.x === sx && p.y === sy);
            if (idx >= 0) extras.splice(idx, 1);
            else extras.push({ x: sx, y: sy });
            draw();
        }

        // ---- geometry helpers ----

        function inCone(x, y) {
            // Inside σ = cone(v1, v2) if (x,y) = a*v1 + b*v2 with a,b >= 0 (allowing
            // a small numerical tolerance). Handles the degenerate (collinear) case
            // by checking the ray.
            const det = v1.x * v2.y - v1.y * v2.x;
            if (Math.abs(det) < 1e-9) {
                // collinear cone — only the ray
                const mag1Sq = v1.x*v1.x + v1.y*v1.y;
                const mag2Sq = v2.x*v2.x + v2.y*v2.y;
                if (mag1Sq < 1e-9 && mag2Sq < 1e-9) return false;
                const onRay = (vx, vy) => {
                    if (vx*vx + vy*vy < 1e-9) return false;
                    if (Math.abs(x*vy - y*vx) > 0.05) return false;
                    return (x*vx + y*vy) >= 0;
                };
                return onRay(v1.x, v1.y) || onRay(v2.x, v2.y);
            }
            const a = (x * v2.y - y * v2.x) / det;
            const b = (v1.x * y - v1.y * x) / det;
            return a >= -1e-6 && b >= -1e-6;
        }

        // Compute the set of lattice points generated by {v1, v2, ...extras} as
        // a Z_{>=0}-monoid, restricted to |x|,|y| <= maxC. Returns a Set of
        // "x,y" strings.
        function computeMonoid(maxC) {
            const gens = [v1, v2, ...extras];
            const visited = new Set(['0,0']);
            const stack = [{ x: 0, y: 0 }];
            // safety cap so a malformed cone (zero-vector generator) can't loop
            const CAP = 30000;
            let n = 0;
            while (stack.length && n < CAP) {
                const p = stack.pop();
                n++;
                for (const g of gens) {
                    if (g.x === 0 && g.y === 0) continue;
                    const nx = p.x + g.x, ny = p.y + g.y;
                    if (Math.abs(nx) > maxC || Math.abs(ny) > maxC) continue;
                    const key = nx + ',' + ny;
                    if (!visited.has(key)) {
                        visited.add(key);
                        stack.push({ x: nx, y: ny });
                    }
                }
            }
            return visited;
        }

        // ---- drawing ----

        function drawGrid() {
            const w = canvas.width, h = canvas.height;
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            let startX = Math.floor(toWorld(0, 0).x);
            let endX = Math.ceil(toWorld(w, 0).x);
            for (let x = startX; x <= endX; x++) {
                const s = toScreen(x, 0);
                ctx.beginPath(); ctx.moveTo(s.x, 0); ctx.lineTo(s.x, h); ctx.stroke();
            }
            let startY = Math.floor(toWorld(0, h).y);
            let endY = Math.ceil(toWorld(0, 0).y);
            for (let y = startY; y <= endY; y++) {
                const s = toScreen(0, y);
                ctx.beginPath(); ctx.moveTo(0, s.y); ctx.lineTo(w, s.y); ctx.stroke();
            }
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
            const origin = toScreen(0, 0);
            ctx.beginPath(); ctx.moveTo(0, origin.y); ctx.lineTo(w, origin.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, h); ctx.stroke();
        }

        function drawCone() {
            const det = v1.x * v2.y - v1.y * v2.x;
            if (Math.abs(det) < 1e-9 && (v1.x*v2.x + v1.y*v2.y) >= 0) return;

            const origin = toScreen(0, 0);
            const t = 200;
            const p1 = toScreen(v1.x * t, v1.y * t);
            const p2 = toScreen(v2.x * t, v2.y * t);

            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
            ctx.beginPath();
            ctx.moveTo(origin.x, origin.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.closePath();
            ctx.fill();

            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
            ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawLattice() {
            const w = canvas.width, h = canvas.height;
            let startX = Math.floor(toWorld(0, 0).x);
            let endX = Math.ceil(toWorld(w, 0).x);
            let startY = Math.floor(toWorld(0, h).y);
            let endY = Math.ceil(toWorld(0, 0).y);
            const maxC = Math.max(Math.abs(startX), Math.abs(endX), Math.abs(startY), Math.abs(endY)) + 1;

            const monoid = computeMonoid(maxC);

            for (let x = startX; x <= endX; x++) {
                for (let y = startY; y <= endY; y++) {
                    if (x === 0 && y === 0) {
                        const o = toScreen(0, 0);
                        ctx.fillStyle = '#2563eb';
                        ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, Math.PI * 2); ctx.fill();
                        continue;
                    }
                    if (!inCone(x, y)) continue;
                    const screen = toScreen(x, y);
                    const inMonoid = monoid.has(x + ',' + y);
                    if (inMonoid) {
                        // olive filled dot = generated
                        ctx.fillStyle = '#4d6b14';
                        ctx.beginPath(); ctx.arc(screen.x, screen.y, 5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }

            // highlight extra generators with a purple ring + filled square
            for (const e of extras) {
                const screen = toScreen(e.x, e.y);
                ctx.save();
                ctx.fillStyle = '#a855f7';
                ctx.strokeStyle = '#581c87';
                ctx.lineWidth = 2;
                const hs = 7;
                ctx.fillRect(screen.x - hs, screen.y - hs, 2*hs, 2*hs);
                ctx.strokeRect(screen.x - hs, screen.y - hs, 2*hs, 2*hs);
                ctx.fillStyle = '#581c87';
                ctx.font = 'bold 11px "Cambria Math", "Times New Roman", serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('(' + e.x + ',' + e.y + ')', screen.x + 12, screen.y - 12);
                ctx.restore();
            }
        }

        function drawVectors() {
            const origin = toScreen(0, 0);
            const p1 = toScreen(v1.x, v1.y);
            const p2 = toScreen(v2.x, v2.y);

            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3; drawArrow(origin.x, origin.y, p1.x, p1.y);
            ctx.strokeStyle = '#10b981'; drawArrow(origin.x, origin.y, p2.x, p2.y);

            ctx.fillStyle = '#3b82f6';
            ctx.beginPath(); ctx.arc(p1.x, p1.y, 7, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#10b981';
            ctx.beginPath(); ctx.arc(p2.x, p2.y, 7, 0, Math.PI * 2); ctx.fill();
            ctx.stroke();

            // labels v1, v2
            ctx.fillStyle = '#1e40af';
            ctx.font = 'bold 13px "Cambria Math", "Times New Roman", serif';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText('v₁ = (' + v1.x + ',' + v1.y + ')', p1.x + 12, p1.y - 12);
            ctx.fillStyle = '#065f46';
            ctx.fillText('v₂ = (' + v2.x + ',' + v2.y + ')', p2.x + 12, p2.y - 12);
        }

        function drawArrow(x1, y1, x2, y2) {
            const headlen = 11;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawCone();
            drawLattice();
            drawVectors();
        }

        window.onload = init;
    </script>
</body>
</html>
